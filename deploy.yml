name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi
      - name: Apply cache patch
        run: |
          # Применяем патч к telegram_bot.py
          patch telegram_bot.py apply_ttl_cache.patch || true
      - name: Restart Railway service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Используем CLI Railway для перезапуска
          npm install -g railway
          railway login --apiKey $RAILWAY_TOKEN
          railway up --detach
